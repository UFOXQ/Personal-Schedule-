name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze-test:
    # 项目只面向 Android + Windows，依赖里 tray_manager 的原生代码在 Linux 上要 GTK/X11 头文件，
    # 直接跑在 windows-latest 上既贴合目标平台，也省掉一堆 apt 依赖。
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.50.0'
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test --reporter expanded

  build-apk:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: analyze-test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.50.0'
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Restore keystore
        shell: pwsh
        run: |
          if (-not "${{ secrets.KEYSTORE_BASE64 }}") {
            Write-Host "KEYSTORE_BASE64 未配置，跳过签名，产物为 debug 签名"
            exit 0
          }
          [IO.File]::WriteAllBytes("android/app/tnt-release.jks", [Convert]::FromBase64String("${{ secrets.KEYSTORE_BASE64 }}"))
          @"
          storePassword=${{ secrets.KEYSTORE_PASSWORD }}
          keyPassword=${{ secrets.KEY_PASSWORD }}
          keyAlias=${{ secrets.KEY_ALIAS }}
          storeFile=tnt-release.jks
          "@ | Set-Content -Encoding ascii android/key.properties
      - run: flutter build apk --release --split-per-abi
      - uses: actions/upload-artifact@v4
        with:
          name: tnt-apk
          path: build/app/outputs/flutter-apk/*-release.apk
