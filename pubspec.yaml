name: tnt_app
description: "TNT —— 一天时间轴上的方块事件管理（Android + Windows）"
publish_to: 'none'
version: 0.2.1+31

environment:
  sdk: ^3.14.0

dependencies:
  flutter:
    sdk: flutter
  material_ui: ^1.1.0
  # 状态管理
  flutter_riverpod: ^3.5.0

  # 基础设施
  uuid: ^4.6.0
  path: ^1.9.1
  path_provider: ^2.1.6

  # 本地数据库
  drift: ^2.35.0
  # 桌面窗口与托盘（Windows 端）
  window_manager: ^0.7.0
  tray_manager: ^0.9.0
  local_notifier: ^0.1.6

  # 通知（Android 端）
  flutter_local_notifications: ^23.0.2
  timezone: ^0.11.2
  flutter_timezone: ^5.1.1
  shared_preferences: ^2.5.6

  # 桌面小组件（Android 端）
  home_widget: ^0.10.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.17.0
  drift_dev: ^2.35.0

flutter:
  uses-material-design: true

  assets:
    - assets/tray_icon.png
